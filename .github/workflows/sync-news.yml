name: Sincronizar Últimas Notícias

on:
  schedule:
    # Executa automaticamente todos os dias às 06:00 e 18:00 UTC (03:00 e 15:00 de Brasília)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Permite execução manual pelo botão na aba Actions do GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar Sincronização de Notícias
        run: node sync-news.js

      - name: Verificar e Salvar Alterações
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "Nenhuma notícia nova encontrada."
          else
            git commit -m "chore(noticias): atualiza news.json com as últimas notícias [skip ci]"
            git push
          fi

